<main>
  <img src="assets/results.png" alt="results"> 

  <div class="results-container">
    <p class="bitcount-text">{{ storedName }} <span>+</span> PHUME</p>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progress"></div>
    </div>

    <!-- Display percentage -->
    <p class="bitcount-text">{{ progress }}%</p>

    <!-- Continue button (hidden until flag is true) -->
    <div *ngIf="showContinue" class="continue-btn">
      <button routerLink="/message" class="bitcount-text">CONTINUE</button>
    </div>
  </div>
</main>
